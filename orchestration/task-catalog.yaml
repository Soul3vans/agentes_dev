# orchestration/task-catalog.yaml
# Catálogo de tipos de tarea y reglas de enrutamiento del orchestrator.
# Este archivo es la ÚNICA fuente de verdad para decidir a qué agente
# delegar cada solicitud, Y para decidir si esa delegación requiere
# confirmación humana antes de ejecutarse. El orchestrator no debe tener
# reglas hardcodeadas de ninguno de los dos tipos.
#
# requires_human_confirmation: si un type lo omite, el default es TRUE
#   (más seguro por omisión — nunca se asume "sin confirmación" por silencio).
# allowed_executors: si un type lo omite, no hay restricción adicional más
#   allá de la que ya impone "handler".
#
# Resolución: si existe context/task-catalog.override.yaml en el proyecto,
# sus entradas sobrescriben (por campo "type") a las de este archivo base.
# Para A/B testing de rutas: crear variantes (ej. task-catalog.variant-b.yaml)
# y activar cuál se usa mediante flag en context/constraints.md.

version: "1.2.0"
last_updated: "2026-09-13"

task_types:

  - type: feature
    description: >
      Nueva funcionalidad solicitada por el PM. Punto de entrada obligatorio
      para todo requerimiento funcional nuevo.
      En Escenario A (Greenfield) se sigue el flujo completo hasta módulo
      finalizado → QA → Cybersecurity (Cybersecurity se activa siempre
      después de QA, según agentes/qa-reviewer.md sección 8 y
      agentes/cybersecurity.md sección 2).
      En Escenario B (Brownfield) primero se revisa el estado existente
      (project_review) antes de planificar la feature.
    handler: tech-lead
    entry_requirement: none   # tech-lead es quien CREA el spec, no lo requiere previo
    escalation:
      condition: >
        La feature implica decisión arquitectónica: nueva base de datos,
        nuevo patrón de diseño, integración externa relevante, o cambio de
        arquitectura existente.
      to: architect
      then_returns_to: tech-lead   # tras el ADR, tech-lead retoma la descomposición
    security_check:
      source: context/security-triggers.yaml
      applies_to: qa-reviewer
      note: >
        qa-reviewer cruza el diff/módulo contra los patrones de este archivo
        (vía grep en nion-cli) como disparador de PRIORIDAD para
        cybersecurity, no como condición de entrada — cybersecurity se
        activa siempre, haya o no coincidencias.
    requires_context:
      - context/project.md
      - context/constraints.md
      - context/security-triggers.yaml
      - specs/00-status.md
    produces:
      - specs/*.md
    risk_level: medium

  - type: project_review
    description: >
      Revisión inicial del estado de un proyecto existente (Brownfield).
      Primero QA, luego Cybersecurity. Los hallazgos se presentan a tech-lead
      para negociación con el PM antes de planificar nuevas features.
    handler: tech-lead
    entry_requirement: none
    escalation: null
    requires_context:
      - context/constraints.md
      - specs/00-status.md
    produces:
      - reporte de hallazgos
      - actualización de specs/00-status.md
    risk_level: high

  - type: architecture_change
    description: >
      Solicitud explícita de diseño/rediseño arquitectónico, sin pasar por
      descomposición de feature primero (ej. "necesito definir cómo escalar
      el módulo de pagos").
    handler: architect
    entry_requirement: none
    escalation: null
    requires_context:
      - context/architecture.md
      - context/tech-stack.md
      - specs/00-status.md
    produces:
      - docs/adr/*.md
    risk_level: high

  - type: bug
    description: >
      Reporte de error. El handler se determina dinámicamente según
      severidad y claridad del diagnóstico, no siempre pasa por qa-reviewer.
    handler: dynamic
    routing_rule:
      - condition: >
          Bug trivial, con stack trace claro, causa evidente en una sola
          capa/módulo identificable.
        handler: dev_by_layer   # frontend-dev o backend-dev según capa afectada
      - condition: >
          Bug complejo, no reproducible de forma directa, causa incierta o
          que abarca múltiples módulos/capas.
        handler: qa-reviewer
        then_returns_to: dev_by_layer
    entry_requirement: none
    escalation:
      condition: >
        El diagnóstico revela que el bug requiere cambio arquitectónico
        (no un simple fix).
      to: architect
      then_returns_to: tech-lead
    security_check:
      source: context/security-triggers.yaml
      applies_to: qa-reviewer
      note: >
        Aplica solo cuando el routing_rule asigna el bug a qa-reviewer
        (bug complejo). Si el fix propuesto por dev_by_layer coincide con
        algún patrón de security-triggers.yaml, tech-lead debe activar
        cybersecurity antes de cerrar la tarea, incluso en un bug trivial.
    requires_context:
      - specs/*.md   # si existe spec relacionado a la funcionalidad afectada
      - context/security-triggers.yaml
      - specs/00-status.md
    produces:
      - fix (diff)
      - test de regresión
    risk_level: variable   # depende de la severidad detectada por orchestrator

  - type: code_review
    description: >
      Revisión de una propuesta de cambio (diff) ya generada por un dev,
      antes de considerarse completa.
    handler: qa-reviewer
    entry_requirement:
      - spec relacionado (si aplica)
      - diff propuesto por dev
    escalation:
      condition: "3 rechazos consecutivos sobre la misma propuesta"
      to: tech-lead
    requires_context:
      - context/constraints.md
      - context/architecture.md
      - specs/00-status.md
    produces:
      - reporte de aprobación/rechazo
    risk_level: medium

  - type: security_audit
    description: >
      Cubre auditoría de vulnerabilidades, revisión de dependencias,
      análisis de secretos expuestos, threat modeling, y validación de
      PRs/cambios sensibles (auth, pagos, datos personales).
    handler: cybersecurity
    entry_requirement: none
    escalation: null
    requires_context:
      - context/constraints.md
      - agentes/cybersecurity.md
      - specs/00-status.md
    produces:
      - reporte de hallazgos
      - severidad clasificada (crítica/alta/media/baja)
    risk_level: high

  - type: project_question
    description: >
      Pregunta sobre el estado, contexto, historial o configuración del
      proyecto. No requiere delegar a ningún rol técnico.
    handler: orchestrator
    entry_requirement: none
    escalation: null
    requires_context:
      - context/project.md
      - specs/00-status.md
    produces:
      - respuesta directa
    risk_level: low

  - type: project_create
    description: >
      Crear un proyecto nuevo de trabajo. Operación de gestión de workspace
      (Carril A del Execution Service, ver iron_ops/execution_service.py),
      no de código de producción — no requiere spec previo ni confirmación
      humana. El Command Parser sanitiza el nombre antes de crear la carpeta.
    handler: project-service
    entry_requirement: none
    escalation: null
    requires_human_confirmation: false
    allowed_executors: [orchestrator]
    requires_context: []
    produces:
      - proyecto nuevo registrado en ~/.iron/projects.json
    risk_level: low

  - type: project_clone
    description: >
      Clonar un repositorio existente como proyecto de trabajo (Carril A).
      El Command Parser (iron_ops/command_parser.py) valida la sintaxis de
      la URL y corrige errores obvios (ej. owner/repo intercambiados) antes
      de ejecutar; si no hay corrección segura, se detiene y pregunta al PM
      — pero la ejecución del clonado en sí no requiere confirmación.
    handler: project-service
    entry_requirement: none
    escalation: null
    requires_human_confirmation: false
    allowed_executors: [orchestrator]
    requires_context: []
    produces:
      - proyecto clonado y registrado en ~/.iron/projects.json
    risk_level: low

  - type: project_switch
    description: >
      Cambiar cuál es el proyecto activo. Resuelve por coincidencia exacta
      o por corrección de alta confianza (distancia de edición) contra la
      lista real de proyectos existentes; ante ambigüedad genuina entre dos
      o más proyectos parecidos, se detiene y pregunta al PM cuál eligió.
    handler: project-service
    entry_requirement: none
    escalation: null
    requires_human_confirmation: false
    allowed_executors: [orchestrator]
    requires_context: []
    produces:
      - active_project actualizado en ~/.iron/projects.json
    risk_level: low

  - type: test_execution
    description: >
      Crear y ejecutar un test NUEVO, dentro del alcance de la tarea actual
      (Carril B del Execution Service). Exclusivo de qa-reviewer y
      cybersecurity — frontend-dev y backend-dev NUNCA usan este type,
      siguen bajo el flujo de confirmación normal de
      orchestration/workflow.md sección 5. Correr una suite ya existente
      que el ejecutor no creó tampoco entra acá: eso también sigue el flujo
      de confirmación normal (ver agentes/qa-reviewer.md sección 2).
      La Action {stack, target_path, flags} se valida contra
      orchestration/test-runners.yaml (+ override del proyecto) antes de
      llegar al Execution Service — cualquier stack, ruta o flag fuera del
      catálogo se rechaza sin ejecutar nada.
    handler: dynamic
    routing_rule:
      - condition: >
          El ejecutor es qa-reviewer o cybersecurity, y el test es nuevo
          (creado dentro del alcance de la tarea actual).
        handler: qa_or_cyber_no_confirmation
      - condition: >
          El ejecutor es frontend-dev/backend-dev, o el test corre sobre
          código/suite ya existente que el ejecutor no creó.
        handler: flujo_normal_con_confirmacion   # ver workflow.md §5
    entry_requirement: none
    escalation: null
    requires_human_confirmation: false
    allowed_executors: [qa-reviewer, cybersecurity]
    requires_context:
      - orchestration/test-runners.yaml
      - context/test-runners.override.yaml
    produces:
      - evidencia real (stdout/stderr/exit_code) para el veredicto de QA/Cybersecurity
    risk_level: low

  - type: ambiguous
    description: >
      Solicitud que no encaja claramente en ningún tipo anterior, o que
      carece de información suficiente para clasificar con confianza.
    handler: orchestrator
    entry_requirement: none
    escalation:
      condition: siempre
      to: PM
      action: "Solicitar aclaración antes de delegar a cualquier agente."
    requires_context: []
    produces:
      - pregunta de aclaración al PM
    risk_level: low
